[FREELOADER]
DefaultOS=LiveImg_RamDiskCD
TimeOut=10

[Display]
TitleText=WinDosDX Boot Media
MinimalUI=Yes

[Operating Systems]
Setup="WinDosDX Setup (Text Mode)"
LiveImg="WinDosDX Live Environment (Graphics Mode)"
LiveImg_RamDisk="WinDosDX Live Environment - RamDisk"
LiveImg_RamDiskCD="WinDosDX Live Environment - RamDisk (read-only)"
==
;; The entries below are for testing and development:
Setup_Debug="Setup (Debug)"
Setup_Screen="Setup (Screen Debug)"
LiveImg_Debug="Live (Debug)"
LiveImg_VBoxDebug="Live (VBox Debug)"
LiveImg_Screen="Live (Screen Debug)"
LiveImg_RamDiskDebug="Live RamDisk, writable (Debug)"
;; The following entry is an example template:
;LiveImg_LogFile="Live (Log file)"

[Setup]
BootType=ReactOSSetup

[Setup_Debug]
BootType=ReactOSSetup
Options=/DEBUG /DEBUGPORT=COM1 /BAUDRATE=115200 /NOGUIBOOT /SIFOPTIONSOVERRIDE

[Setup_Screen]
BootType=ReactOSSetup
Options=/DEBUG /DEBUGPORT=SCREEN /SIFOPTIONSOVERRIDE

[LiveImg]
BootType=Windows2003
SystemPath=\reactos
Options=/FASTDETECT /MININT

; The live files on a FAT volume in memory (liveimg.img): X: is writable,
; so programs can save their settings, as in Windows PE.
[LiveImg_RamDisk]
BootType=Windows2003
SystemPath=ramdisk(0)\reactos
Options=/FASTDETECT /MININT /RDPATH=liveimg.img

; The whole CD in memory, exported read-only (the former default).
[LiveImg_RamDiskCD]
BootType=Windows2003
SystemPath=ramdisk(0)\reactos
Options=/FASTDETECT /MININT /RDPATH= /RDEXPORTASCD
;Options=/FASTDETECT /MININT /RDPATH=liveimg.iso /RDEXPORTASCD

[LiveImg_Debug]
BootType=Windows2003
SystemPath=\reactos
Options=/DEBUG /DEBUGPORT=COM1 /BAUDRATE=115200 /SOS /FASTDETECT /MININT

[LiveImg_RamDiskDebug]
BootType=Windows2003
SystemPath=ramdisk(0)\reactos
Options=/DEBUG /DEBUGPORT=COM1 /BAUDRATE=115200 /SOS /FASTDETECT /MININT /RDPATH=liveimg.img

[LiveImg_VBoxDebug]
BootType=Windows2003
SystemPath=\reactos
Options=/DEBUG /DEBUGPORT=VBOX /SOS /FASTDETECT /MININT

[LiveImg_Screen]
BootType=Windows2003
SystemPath=\reactos
Options=/DEBUG /DEBUGPORT=SCREEN /SOS /FASTDETECT /MININT

;[LiveImg_LogFile]
;BootType=Windows2003
;SystemPath=\reactos
;Options=/DEBUG /DEBUGPORT=FILE:\Device\HarddiskX\PartitionY\debug.log /SOS /FASTDETECT /MININT
