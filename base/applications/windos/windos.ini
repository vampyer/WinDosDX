; windos.ini - WinDosDX DOS 6.22 machine settings
;
; Settings are read in this order, each overriding the one before:
;   1. WinDosDX.ini or windos.ini next to windos.exe (system-wide defaults)
;   2. %APPDATA%\WinDosDX\windos.ini (your settings; the Settings window
;      writes here when "All DOS programs" is chosen)
;   3. %APPDATA%\WinDosDX\profiles\<folder> - <program>.ini (a game profile;
;      the Settings window writes here when "Only <program>" is chosen)
; All keys are optional. Lines starting with ';' or '#' are comments, and
; [section] lines are only for readability.

[Machine]
; Window title for the DOS prompt (a program shows its own name).
;title=WinDosDX DOS 6.22

; CPU speed in cycles per millisecond. 0 = automatic.
;cycles=0

; Emulated memory in MB (1-63).
;memsize=16

; Graphics card: svga_s3, vgaonly, ega, cga, tandy, hercules.
;machine=svga_s3

; Sound card: sb16, sbpro2, sb2, none. mute=1 turns sound off.
;sbtype=sb16
;mute=0

[Display]
; Window size: 1-4 times the DOS resolution (smaller if the screen is).
;scale=2
; Show DOS modes at 4:3, as on a DOS monitor.
;aspect=1
; Smooth scaling instead of sharp pixels.
;smooth=0
; Start in full screen (Alt+Enter switches).
;fullscreen=0

[Mounts]
; DOS drive letters mapped to Windows folders. When Windows opens a DOS
; program, its folder is C: whatever mountC says. Without mountC, the DOS
; prompt uses %USERPROFILE%\DOS.
;mountC=C:\DOS
;mountD=D:\Games
