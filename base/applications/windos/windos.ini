; windos.ini - WinDosDX DOS Engine configuration
;
; Place this file next to windos.exe. All keys are optional; defaults apply
; when a key is absent. Lines starting with ';' or '#' are comments.

[Machine]
; Window title.
title=WinDosDX

; Initial windowed mode (DOS text is 720x400; graphics modes vary).
width=720
height=400

; Emulated CPU cycles. 0 = auto. Higher = faster but less accurate.
cycles=3000

; Conventional memory in KiB. 0 = auto.
memory=640

; Start fullscreen (1) or windowed (0).
fullscreen=0

; Start with sound muted (1) or enabled (0).
mute=0

[Mounts]
; Map DOS drive letters to host directories. A missing drive is simply
; unmounted. The DOS core's localDrive layer reads/writes through these.
mountC=D:\WinDosDX\DOSDrive
mountD=D:\WinDosDX\Games
